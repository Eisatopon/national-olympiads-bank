name: Audit IMC 1994-2026 review integrity
on:
  workflow_dispatch:
  push:
    paths:
      - undergraduate/IMC-1994-2026-review.json
      - scripts/audit_imc_1994_2026.py
      - .github/workflows/audit-imc-1994-2026.yml
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify year counts and editorial source-review gate
        run: python scripts/audit_imc_1994_2026.py
