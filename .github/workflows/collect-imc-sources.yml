name: Collect IMC source archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-imc-sources.yml'
      - 'scripts/fetch_imc_sources.py'
      - 'scripts/stage_imc_statements.py'
      - 'scripts/prepare_imc_review_json.py'

permissions:
  contents: write

jobs:
  collect-imc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official and comparison pages for 1994-2026
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_imc_sources.py --output imc-source-archive
      - name: Install parsing dependency
        if: steps.fetch.outcome == 'success'
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Stage candidate statements from annual pages
        if: steps.fetch.outcome == 'success'
        id: stage
        continue-on-error: true
        run: python scripts/stage_imc_statements.py --archive imc-source-archive --output imc-review/unverified-candidates.json
      - name: Prepare complete IMC review JSON if all 354 statements are nonempty
        if: steps.stage.outcome == 'success'
        id: prepare
        continue-on-error: true
        run: python scripts/prepare_imc_review_json.py --input imc-review/unverified-candidates.json --output undergraduate/IMC-1994-2026-review.json
      - name: Commit complete non-publication-ready review dataset
        if: steps.prepare.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add undergraduate/IMC-1994-2026-review.json
          if git diff --cached --quiet; then
            echo "Review dataset unchanged"
          else
            git commit -m "Stage 354 IMC statement candidates for manual PDF verification"
            git push
          fi
      - name: Upload review-only JSON
        if: steps.stage.outcome == 'success' || steps.stage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: imc-statement-candidates-NOT-VERIFIED
          path: imc-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload source archive and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imc-1994-2026-source-archive
          path: imc-source-archive/
          if-no-files-found: error
          retention-days: 14
      - name: Mark incomplete source acquisition as failure
        if: steps.fetch.outcome != 'success'
        run: |
          echo 'Some IMC source pages failed to download. Inspect the manifest artifact.' >&2
          exit 1
      - name: Fail when statement staging is incomplete
        if: steps.fetch.outcome == 'success' && steps.stage.outcome != 'success'
        run: |
          echo 'IMC candidate extraction incomplete: inspect review artifact and logs.' >&2
          exit 1
