name: Validate problem bank
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_loader.cjs
      - run: node tests/test_collections.cjs
      - run: node tests/test_relations.cjs
      - run: node tests/test_provenance.cjs
      - run: node tests/test_pagination.cjs
      - run: python scripts/validate_dna.py
      - run: node tests/test_topics.cjs
      - run: python scripts/validate_topics.py
      - run: python -m unittest discover -s tests
      - run: python scripts/validate_data.py
      - run: python scripts/build_runtime_metadata.py --check
      - run: node tests/test_runtime_metadata.cjs
