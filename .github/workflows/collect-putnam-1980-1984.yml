name: Stage Putnam 1980-1984 PDF originals

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_putnam_1980_1984.py'
      - '.github/workflows/collect-putnam-1980-1984.yml'

permissions:
  contents: read

jobs:
  stage-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm pdftotext availability
        run: pdftotext -v
      - name: Download five original PDF exams and stage 60 raw candidates
        id: collect
        continue-on-error: true
        run: python scripts/collect_putnam_1980_1984.py --output putnam-1980-1984-review
      - name: Upload original PDFs and review-only text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: putnam-1980-1984-original-pdfs-and-unverified-text
          path: putnam-1980-1984-review/
          if-no-files-found: error
          retention-days: 14
      - name: Reject incomplete raw staging
        if: steps.collect.outcome != 'success'
        run: |
          echo 'Putnam 1980–1984 PDF staging incomplete. Inspect artifact; do not publish corrupted mathematics.' >&2
          exit 1
