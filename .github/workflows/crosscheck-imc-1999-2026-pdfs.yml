name: Crosscheck IMC 1999-2026 organizer PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/crosscheck_imc_1999_2026_pdfs.py
      - scripts/attach_imc_official_source_candidates.py
      - .github/workflows/crosscheck-imc-1999-2026-pdfs.yml
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.5
      - name: Check 28 years of official PDFs against 294 draft statements
        run: python scripts/crosscheck_imc_1999_2026_pdfs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imc-1999-2026-official-pdf-crosscheck
          path: staged/imc-1999-2026-pdf-crosscheck/report.json
          retention-days: 90
          if-no-files-found: warn
      - name: Attach provisional official PDF source provenance to all 294 draft statements
        run: python scripts/attach_imc_official_source_candidates.py
      - name: Guard commit against accidental publication
        run: |
          git add undergraduate/IMC-1994-2026-review.json research/imc/official-1999-2026-crosscheck.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("undergraduate/IMC-1994-2026-review.json").read_text())
          assert a["publication_eligible"] is False
          pending=[p for y in a["years"] if 1999<=y["year"]<=2026 for p in y["problems"]]
          assert len(pending)==294 and all(p["statement_verified"] is False for p in pending)
          assert all(p["official_pdf_candidate_url"].startswith("https://") for p in pending)
          PY
          git diff --cached --name-only | grep -Ev '^(undergraduate/IMC-1994-2026-review.json|research/imc/official-1999-2026-crosscheck.json)$' && exit 1 || true
      - name: Commit research-only source audit evidence
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record 1999–2026 IMC official PDF crosschecks (not certified)"
          git pull --rebase origin main
          git push origin HEAD:main
