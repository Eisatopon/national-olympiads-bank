name: Stage Putnam 1958 Spring and Fall separately
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stage_putnam_1958_spring_fall.py
      - .github/workflows/stage-putnam-1958.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 28 research-only statements
        run: python scripts/stage_putnam_1958_spring_fall.py
      - name: Check spring and fall split
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("staged/Putnam-1958-spring-fall-raw-review.json").read_text())
          assert a["publication_eligible"] is False and a["problem_count"]==28
          assert [x["edition"] for x in a["editions"]]==["Spring","Fall"]
          assert all(len(x["problems"])==14 for x in a["editions"])
          assert all(not p["statement_verified"] for x in a["editions"] for p in x["problems"])
          assert all("solution" not in p for x in a["editions"] for p in x["problems"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: putnam-1958-spring-fall-research-review
          path: staged/Putnam-1958-spring-fall-raw-review.json
          retention-days: 30
          if-no-files-found: error
