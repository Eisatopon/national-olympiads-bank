name: Lighthouse performance (mobile and desktop)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/lighthouse-performance.yml'
      - 'scripts/lighthouse-report.cjs'

permissions:
  contents: read

concurrency:
  group: lighthouse-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-package-lock lighthouse@13
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Test actual published site (three runs per device)
        env:
          CHROME_PATH: /usr/bin/chromium
          SITE_URL: https://eisatopon.github.io/national-olympiads-bank/
        run: node scripts/lighthouse-report.cjs
      - name: Upload Lighthouse JSON and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish results in job summary
        if: always()
        run: |
          if [ -f lighthouse-results/summary.md ]; then
            cat lighthouse-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
