name: Stage Putnam 1980-1984 statements
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stage_putnam_gap_1980_1984.py
      - .github/workflows/stage-putnam-gap-1980-1984.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 60 statement candidates
        run: python scripts/stage_putnam_gap_1980_1984.py
      - name: Commit staged review file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add undergraduate/Putnam-1980-1984-raw-review.json
          git diff --cached --quiet || (git commit -m "Stage Putnam 1980-1984 review statements" && git push)
