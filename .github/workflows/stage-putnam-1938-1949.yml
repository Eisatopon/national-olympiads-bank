name: Stage historical Putnam 1938-1949 (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stage_putnam_1938_1949.py
      - .github/workflows/stage-putnam-1938-1949.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact historical source statement IDs
        run: python scripts/stage_putnam_1938_1949.py
      - name: Check research-only artifact and contest years
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('staged/Putnam-1938-1949-raw-review.json').read_text(encoding='utf-8'))
          assert [y['year'] for y in a['years']] == [1938,1939,1940,1941,1942,1946,1947,1948,1949]
          assert a['non_contest_years'] == [1943,1944,1945]
          assert a['publication_eligible'] is False
          assert a['problem_count'] == sum(len(y['problems']) for y in a['years'])
          for year in a['years']:
              assert year['problems']
              for p in year['problems']:
                  assert p['statement_verified'] is False and p['review_flags']
                  assert 'solution' not in p and 'answer' not in p
          print('PASS: staged historical research candidates; none publication-certified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: putnam-1938-1949-research-review
          path: staged/Putnam-1938-1949-raw-review.json
          if-no-files-found: error
          retention-days: 30
