name: Discover official IMC 1999-2026 primary sources
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover_imc_official_1999_2026.py
      - .github/workflows/discover-imc-1999-2026.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover 1999-2026 official source pages and hash evidence
        run: python scripts/discover_imc_official_1999_2026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imc-1999-2026-official-source-evidence
          path: staged/imc-official-1999-2026/
          retention-days: 60
          if-no-files-found: warn
