name: Discover VJIMC original papers
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover_vjimc_originals.py
      - metadata/vojtech-jarnik-editions-source-manifest.json
      - .github/workflows/discover-vjimc-originals.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Probe original numbered competition PDFs
        run: python scripts/discover_vjimc_originals.py
      - uses: actions/upload-artifact@v4
        with:
          name: vjimc-original-paper-source-coverage
          path: out/vjimc-source-discovery.json
