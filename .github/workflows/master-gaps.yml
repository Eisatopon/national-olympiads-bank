name: Master gaps reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
  push:
    paths:
      - '*-problems.json'
      - 'docs/master-gap-register.json'
      - 'scripts/reconcile_master_gaps.py'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check recorded gaps against current repository data
        run: python scripts/reconcile_master_gaps.py
