<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc">
<title id="title">SEEMOUS 2012 problem 2 right-triangle construction</title>
<desc id="desc">Schematic reconstruction of the source's successive right triangles. A0 is the common vertex; A1, A2, A(n-1), An and A(n+1) progress around the outer boundary. Each next triangle uses the previous hypotenuse as a leg.</desc>
