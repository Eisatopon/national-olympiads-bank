<path d="M220 245 L326 105 M220 245 L383 145"/>
<path d="M144 169 L185 126" stroke-dasharray="8 8"/>
<path d="M185 126 L326 105"/>
</g>
<g fill="none" stroke="#172b46" stroke-width="1.4">
<path d="M156 245 L156 233 L144 233"/>
<path d="M153 178 L164 189 L176 178"/>
<path d="M315 116 L328 126 L338 113"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#172b46">
<text x="220" y="270" text-anchor="middle">A₀</text>
<text x="128" y="264">A₁</text>
<text x="114" y="168">A₂</text>
<text x="160" y="119">Aₙ₋₁</text>
<text x="321" y="87">Aₙ</text>
