<style>
:root { --ink: #0f2a44; --accent: #e11d26; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--ink); color: #fff; font: 16px/1.55 'Public Sans', system-ui, 'Segoe UI', Roboto, sans-serif; }
.bar { max-width: 1200px; width: 100%; margin: 0 auto; padding: 18px 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 700; }
.brand img { width: 32px; height: 32px; }
.subjects { display: flex; gap: 8px; flex-wrap: wrap; }
.subjects a { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; color: #fff; text-decoration: none; font-size: .88rem; font-weight: 600; background: rgba(255,255,255,.06); }
.subjects a:hover { background: rgba(255,255,255,.16); }
.subjects a[aria-current] { background: var(--accent); border-color: var(--accent); }
main { flex: 1; display: grid; place-items: center; padding: 40px 16px; text-align: center; }
main > div { width: 100%; max-width: 900px; }
h1 { overflow-wrap: break-word; }
.icon { font-size: 4rem; line-height: 1; }
h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 800; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.1; margin: 18px 0 10px; }
.badge { display: inline-block; padding: 6px 16px; border-radius: 999px; background: #facc15; color: #1a1a1a; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .9rem; }
p { color: #c7d3df; max-width: 560px; margin: 16px auto; }
.back { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 10px; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; }
</style>
</head>
